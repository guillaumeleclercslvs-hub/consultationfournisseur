<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demandes de prix tuyauterie</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 3 colonnes (catalogue | saisie en grille | demande), onglets sur téléphone.
   Palette: crème de l'appli rapport hebdo + rouge #E8432E, acier pour les repères techniques. */
:root{
  --bg:#F6F1E6; --card:#FFFCF5; --ink:#201C17; --mute:#6D6558; --line:#DDD3C0; --soft:#EDE5D3;
  --accent:#E8432E; --accent-ink:#FFFFFF; --steel:#2F4F63; --steel-bg:#DDE7EC; --ok:#2E7D4F; --ok-bg:#DCEEDF;
  --warn-bg:#F9E3B8; --warn:#7A5200;
  --f-head:'Barlow Condensed','Arial Narrow',sans-serif; --f-body:'Barlow','Segoe UI',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17140F; --card:#221E18; --ink:#F2ECDF; --mute:#A39A89; --line:#3A342A; --soft:#2C271F;
  --accent:#FF6B4E; --accent-ink:#1A0F0B; --steel:#9DC3D8; --steel-bg:#22343F; --ok:#6FCB92; --ok-bg:#1F3326;
  --warn-bg:#40320F; --warn:#F0C46A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17140F; --card:#221E18; --ink:#F2ECDF; --mute:#A39A89; --line:#3A342A; --soft:#2C271F;
  --accent:#FF6B4E; --accent-ink:#1A0F0B; --steel:#9DC3D8; --steel-bg:#22343F; --ok:#6FCB92; --ok-bg:#1F3326;
  --warn-bg:#40320F; --warn:#F0C46A; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--f-body);
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  padding-block:10px}
button,input,select,textarea{font:inherit;color:inherit}
.app{height:100%;display:flex;flex-direction:column;gap:10px;min-height:0}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header.top h1{font:700 26px/1 var(--f-head);letter-spacing:.02em;text-transform:uppercase;margin:0}
header.top h1 span{color:var(--accent)}
.sync{margin-left:auto;font-size:12px;color:var(--mute)}
.tabs{display:none;gap:6px}
.tabs button{flex:1;padding:9px 6px;border:1px solid var(--line);background:var(--card);border-radius:6px;font-weight:600;position:relative}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:12px;margin-left:4px}
main{flex:1;min-height:0;display:grid;grid-template-columns:270px minmax(0,1fr) 400px;gap:10px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;min-height:0;min-width:0;display:flex;flex-direction:column}
.panel>.scroll{overflow:auto;flex:1;min-height:0;padding:12px}
.ph{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.ph h2{margin:0;font:700 17px/1 var(--f-head);letter-spacing:.04em;text-transform:uppercase}
input[type=text],input[type=search],input[type=number],select,textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.04em;min-width:0}
label.f>select,label.f>input{text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink);font-size:15px}
.btn{padding:8px 12px;border:1px solid var(--line);background:var(--card);border-radius:6px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(.94)}
.btn.sm{padding:4px 8px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:default}
.x{border:none;background:none;color:var(--mute);cursor:pointer;padding:2px 6px;font-size:18px;line-height:1}
.x:hover{color:var(--accent)}

/* nav */
.nav details{border-bottom:1px solid var(--line)}
.nav summary{cursor:pointer;padding:9px 2px;font:700 16px var(--f-head);letter-spacing:.05em;text-transform:uppercase;list-style:none;display:flex;justify-content:space-between}
.nav summary::-webkit-details-marker{display:none}
.nav summary::after{content:"+";color:var(--mute)}
.nav details[open]>summary::after{content:"–"}
.nav .grp{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin:8px 0 3px;font-weight:600}
.nav .fam{display:block;width:100%;text-align:left;padding:6px 8px;border:none;background:none;border-radius:5px;cursor:pointer;line-height:1.25}
.nav .fam:hover{background:var(--soft)}
.nav .fam[aria-current="true"]{background:var(--ink);color:var(--bg)}
.nav .fam small{display:block;color:var(--mute);font-family:var(--f-mono);font-size:11px}
.nav .fam[aria-current="true"] small{color:var(--bg);opacity:.75}
.nav .body{padding-bottom:8px}

/* builder */
.tag{display:inline-block;padding:2px 8px;border-radius:4px;background:var(--steel-bg);color:var(--steel);font:500 12px var(--f-mono)}
.fh{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.fh h3{margin:0;font:700 24px/1.05 var(--f-head);letter-spacing:.02em}
.sel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-bottom:12px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table.grid{border-collapse:collapse;width:100%}
table.grid th{position:sticky;top:0;background:var(--soft);text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);padding:6px 10px}
table.grid td{padding:4px 10px;border-top:1px solid var(--line)}
table.grid td.r{font-family:var(--f-mono);font-size:12px;color:var(--mute);white-space:nowrap}
table.grid input{width:96px;text-align:right;font-variant-numeric:tabular-nums}
table.grid tr.has td{background:var(--ok-bg)}
.addbar{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.empty{color:var(--mute);padding:20px;text-align:center}
.hint{font-size:13px;color:var(--mute)}
.note{background:var(--warn-bg);color:var(--warn);padding:7px 10px;border-radius:6px;font-size:13px}

/* demande */
.dsel{display:grid;grid-template-columns:1fr auto;gap:6px}
.dform{display:grid;gap:8px;margin:10px 0}
.cat-h{font:700 15px var(--f-head);letter-spacing:.06em;text-transform:uppercase;margin:14px 0 2px;padding-bottom:3px;border-bottom:2px solid var(--ink)}
.fam-h{font-size:12px;color:var(--steel);font-family:var(--f-mono);margin:8px 0 3px}
.ln{display:grid;grid-template-columns:minmax(0,1fr) 64px 104px auto;gap:6px;align-items:center;padding:5px 0;border-bottom:1px dashed var(--line)}
.ln .t{font-size:14px;min-width:0;overflow-wrap:anywhere}
.ln .t em{color:var(--mute);font-style:normal;font-size:12px;font-family:var(--f-mono)}
.ln input,.ln select{padding:4px 6px;font-size:14px}
.ln input{text-align:right}
.mail{width:100%;min-height:230px;font:12.5px/1.5 var(--f-mono);resize:vertical;white-space:pre}
.row{display:flex;gap:6px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:6px;z-index:20;font-size:14px;max-width:90vw}
.free{display:grid;gap:8px;padding:10px;border:1px dashed var(--line);border-radius:6px;margin-top:10px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px}
.chk input{width:auto}

@media (max-width:1180px){
  .tabs{display:flex}
  main{grid-template-columns:minmax(0,1fr)}
  main>.panel{display:none}
  [data-view="nav"] #p-nav,[data-view="build"] #p-build,[data-view="dem"] #p-dem{display:flex}
}
@media (max-width:520px){
  .ln{grid-template-columns:minmax(0,1fr) 60px 92px auto}
  header.top h1{font-size:22px}
}
@media (prefers-reduced-motion:no-preference){.toast{animation:in .15s ease-out}@keyframes in{from{opacity:0;transform:translate(-50%,6px)}}}
</style>

</head><body>
<div class="app" id="app" data-view="build">
  <header class="top">
    <h1>Demandes de prix <span>tuyauterie</span></h1>
    <span class="sync" id="sync" aria-live="polite"></span>
  </header>
  <div class="tabs" role="tablist" id="tabs">
    <button role="tab" data-v="nav" aria-selected="false">Catalogue</button>
    <button role="tab" data-v="build" aria-selected="true">Saisie</button>
    <button role="tab" data-v="dem" aria-selected="false">Demande<span class="badge" id="badge">0</span></button>
  </div>
  <main>
    <section class="panel" id="p-nav" aria-label="Catalogue">
      <div class="ph"><h2>Catalogue</h2></div>
      <div class="scroll nav">
        <input type="search" id="q" placeholder="Rechercher : SMS, bride, DN50, papillon…" aria-label="Rechercher dans le catalogue">
        <div id="navlist"></div>
      </div>
    </section>
    <section class="panel" id="p-build" aria-label="Saisie des quantités">
      <div class="scroll" id="build"></div>
      <div class="addbar" id="addbar"></div>
    </section>
    <section class="panel" id="p-dem" aria-label="Demande en cours">
      <div class="ph"><h2>Demande en cours</h2></div>
      <div class="scroll" id="dem"></div>
    </section>
  </main>
</div>
<div id="toast" class="toast" hidden></div>

/* ---------- Construction d'une ligne ---------- */
function pieceOf(fm){ return fm.pieces[Math.min(cur.piece,fm.pieces.length-1)]; }
function sizesOf(fm,pc){ return ('sizes' in pc)?pc.sizes:(fm.sizes||null); }
function optsOf(fm,pc){ return (fm.opts||[]).concat(pc.opts||[]); }
function matsOf(fm,pc){ return pc.mats||fm.mats||null; }
function optVal(o){ return cur.opts[o.id]!=null?cur.opts[o.id]:o.def; }
function rowsOf(fm){
  if(fm.id==='custom') return S.custom.map(c=>({t:c.label,d:'',custom:c.id,cat:c.cat}));
  if(fm.items) return fm.items;
  const pc=pieceOf(fm), sz=sizesOf(fm,pc);
  if(!sz) return [{t:'Quantité',d:'',none:true}];
  if(pc.two){ const i=Math.min(cur.s1==null?Math.min(5,sz.length-1):cur.s1,sz.length-1); return sz.slice(0,i); }
  return sz;
}
function mkLine(fm,r,q){
  const pc=pieceOf(fm); let dim='', spec=[];
  const op=optsOf(fm,pc), ov={}; op.forEach(o=>ov[o.id]=optVal(o));
  if(r.none) dim=''; else if(pc.two){
    const sz=sizesOf(fm,pc); const i=Math.min(cur.s1==null?Math.min(5,sz.length-1):cur.s1,sz.length-1);
    dim=sz[i].d+(pc.sep||' × ')+r.d;
  } else dim=fm.dim?fm.dim(r,null,ov):r.d;
  const mt=fm.fixedMat||(matsOf(fm,pc)?(cur.mat&&matsOf(fm,pc).includes(cur.mat)?cur.mat:matsOf(fm,pc)[0]):null);
  if(mt) spec.push(mt);
  op.forEach(o=>{ if(o.inDim) return; spec.push((o.lab||'')+ov[o.id]+(o.suf||'')); });
  if(pc.len&&cur.len) spec.push('L = '+cur.len+' mm');
  let sd=''; if(!r.none){ sd=(r.s!=null?r.s:r.d); if(pc.two){ const sz2=sizesOf(fm,pc); const i2=Math.min(cur.s1==null?Math.min(5,sz2.length-1):cur.s1,sz2.length-1); const a2=sz2[i2]; sd=(a2.s!=null?a2.s:a2.d)+(pc.sep||' × ')+sd; } }
  const ss=[]; if(mt){ const ms=mt.replace(/\s*\(.*$/,''); ss.push(/inox/i.test(pc.n)?ms.replace(/^inox /,''):ms); }
  op.forEach(o=>{ if(['ex','face','surf','ext','ft'].includes(o.id)) return; const v=ov[o.id]; if(o.id==='ep'&&!o.lab&&/^\d/.test(v)) ss.push('ép. '+v+(/mm/.test(v)?'':' mm')); else ss.push((o.lab||'')+v.replace(/\s*\(.*?\)/g,'')+(o.suf||'')); });
  if(pc.len&&cur.len) ss.push('L = '+cur.len+' mm');
  return {id:uid(),cat:fm.cat,famId:fm.id,famTitle:fm.title,norm:fm.norm||'',name:pc.n,dim,spec:spec.join(', '),sd,ss:ss.join(' '),ref:r.ref||'',qty:q,unit:cur.unit||pc.unit||fm.unit||'pièces',note:cur.note||''};
}
function lineKey(l){return [l.famId,l.name,l.dim,l.spec,l.ref,l.unit,l.note].join('|')}
function addLines(lines){
  let d=act(); if(!d||d.ex){ d=newDemande(); }
  lines.forEach(l=>{ const m=d.lines.find(x=>lineKey(x)===lineKey(l)); if(m) m.qty=Math.round((m.qty+l.qty)*1000)/1000; else d.lines.push(l); });
  save(); renderDem(); renderBadge();
}
function newDemande(){
  const d={id:uid(),objet:'',four:'',lines:[]}; S.demandes.push(d); S.activeId=d.id; return d;
}

/* ---------- Texte du mail ---------- */
function qtyStr(q){return String(q).replace('.',',')}
const dimOf=l=>l.sd!=null?l.sd:l.dim, specOf=l=>l.ss!=null?l.ss:l.spec;
function lineText(l){
  return l.name+(dimOf(l)?' '+dimOf(l):'')+(specOf(l)?' '+specOf(l):'')+(l.ref?' – réf. '+l.ref:'')+(l.note?' ('+l.note+')':'');
}
function grouped(d){
  const out=[];
  CATS.forEach(c=>{
    const ls=d.lines.filter(l=>l.cat===c.id); if(!ls.length) return;
    const fams=[]; ls.forEach(l=>{ let g=fams.find(x=>x.key===l.famId); if(!g){g={key:l.famId,title:l.famTitle,norm:l.norm,lines:[]};fams.push(g);} g.lines.push(l); });
    out.push({cat:c,fams});
  });
  return out;
}
function mailText(d){
  const g=grouped(d); const obj=(d.objet||'').trim()||'matériel tuyauterie';
  let t='Objet : Demande de devis - '+obj+'\n\nBonjour,\n\nPourriez-vous nous communiquer votre meilleur prix et votre délai pour le matériel suivant :\n';
  g.forEach(c=>{
    t+='\n'+c.cat.t.toUpperCase()+'\n';
    c.fams.forEach(fm=>{
      t+='\n'+fm.title+'\n';
      fm.lines.forEach(l=>{ t+='- '+qtyStr(l.qty)+' '+(l.qty<=1&&l.unit==='pièces'?'pièce':l.unit)+' : '+lineText(l)+'\n'; });
    });
  });
  if(S.cert) t+='\nCertificats matière 3.1 demandés.\n';
  t+='\nMerci d\'avance.\nCordialement,';
  return t;
}
function csvText(d){
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const rows=[['Catégorie','Famille','Norme','Désignation','Réf. fournisseur','Quantité','Unité','Remarque']];
  grouped(d).forEach(c=>c.fams.forEach(fm=>fm.lines.forEach(l=>rows.push([c.cat.t,fm.title,fm.norm,(l.name+(dimOf(l)?' '+dimOf(l):'')+(specOf(l)?' '+specOf(l):'')),l.ref,qtyStr(l.qty),l.unit,l.note]))));
  return '﻿'+rows.map(r=>r.map(q).join(';')).join('\r\n');
}

}

/* ---------- Actions ---------- */
function toast(t){ const e=$('toast'); e.textContent=t; e.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>e.hidden=true,2200); }
async function copy(text){
  try{ await navigator.clipboard.writeText(text); toast('Mail copié'); return; }catch(e){}
  const m=$('mail');
  try{ m.removeAttribute('readonly'); m.focus(); m.select(); if(document.execCommand('copy')){ m.setAttribute('readonly',''); toast('Mail copié'); return; } }catch(e){}
  toast('Texte sélectionné : faites Ctrl+C');
}
function renderAll(){ renderNav(); renderBuild(); renderDem(); }
function resetCur(id){ cur={fam:id,piece:0,mat:null,opts:{},s1:null,qty:{},unit:null,note:'',len:''}; }

document.addEventListener('click',async e=>{
  const t=e.target.closest('button,summary'); if(!t) return;
  if(t.dataset.fam){ resetCur(t.dataset.fam); renderNav(); renderBuild(); $('app').dataset.view='build'; syncTabs(); $('build').scrollTop=0; return; }
  if(t.dataset.v){ $('app').dataset.view=t.dataset.v; syncTabs(); return; }
  if(t.id==='addbtn'){
    const lines=[];
    if(cur.fam==='custom'){
      S.custom.forEach(c=>{ const v=parseFloat(String(cur.qty[c.label]||'').replace(',','.')); if(v>0) lines.push({id:uid(),cat:c.cat,famId:'custom',famTitle:'Articles libres',norm:'',name:c.label,dim:'',spec:'',ref:'',qty:v,unit:c.unit||'pièces',note:''}); });
    } else { const fm=fam(cur.fam); rowsOf(fm).forEach((r,i)=>{ const q=qtyOf(i); if(q) lines.push(mkLine(fm,r,q)); }); }
    if(!lines.length) return;
    addLines(lines); cur.qty={}; renderBuild(); toast(lines.length+' ligne(s) ajoutée(s)'); return;
  }
  if(t.id==='c-add'){
    const lab=$('c-lab').value.trim(), q=parseFloat(String($('c-qty').value).replace(',','.')); if(!lab||!(q>0)){ toast('Saisissez une désignation et une quantité'); return; }
    const cat=$('c-cat').value, unit=$('c-unit').value;
    if($('c-mem').checked&&!S.custom.some(c=>c.label===lab&&c.cat===cat)) S.custom.push({id:uid(),cat,label:lab,unit});
    addLines([{id:uid(),cat,famId:'custom',famTitle:'Articles libres',norm:'',name:lab,dim:'',spec:'',ref:'',qty:q,unit,note:''}]);
    renderBuild(); toast('Ligne ajoutée'); return;
  }
  if(t.dataset.delc){ S.custom=S.custom.filter(c=>c.id!==t.dataset.delc); save(); renderBuild(); renderNav(); return; }
  if(t.id==='dnew'){ newDemande(); save(); renderDem(); return; }
  const d=act();
  if(t.dataset.ld&&d){ d.lines=d.lines.filter(l=>l.id!==t.dataset.ld); save(); renderDem(); return; }
  if(t.id==='bcopy'&&d){ copy(mailText(d)); return; }
  if(t.id==='bclear'&&d){ d.lines=[]; delete d.ex; save(); renderDem(); return; }
  if(t.id==='bdel'&&d){ S.demandes=S.demandes.filter(x=>x!==d); S.activeId=S.demandes.length?S.demandes[0].id:null; save(); renderDem(); return; }
  if(t.id==='bsplit'&&d){
    const g=grouped(d); if(g.length<2){ toast('Une seule catégorie : rien à séparer'); return; }
    g.forEach(c=>{ S.demandes.push({id:uid(),objet:(d.objet?d.objet+' – ':'')+c.cat.t,four:d.four||'',lines:c.fams.reduce((a,x)=>a.concat(x.lines.map(l=>Object.assign({},l,{id:uid()}))),[])}); });
    S.activeId=S.demandes[S.demandes.length-g.length].id; save(); renderDem(); toast(g.length+' demandes créées (l\'originale est conservée)'); return;
  }
  if(t.id==='bcsv'&&d){
    const name=((d.objet||'demande_de_prix').replace(/[^\w\-]+/g,'_'))+'.csv';
    const blob=new Blob([csvText(d)],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    return;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){ query=t.value; renderNav(); return; }
  if(t.dataset.q!=null){ const fm=cur.fam==='custom'?null:fam(cur.fam); const key=fm?rowsOf(fm)[+t.dataset.q].t:S.custom[+t.dataset.q].label; cur.qty[key]=t.value; t.closest('tr').classList.toggle('has',parseFloat(String(t.value).replace(',','.'))>0); renderAdd(); return; }
  if(t.dataset.sel==='len'){ cur.len=t.value; return; }
  if(t.dataset.sel==='note'){ cur.note=t.value; return; }
  const d=act();
  if(t.id==='dobj'&&d){ d.objet=t.value; refreshMail(); const o=$('dsel').selectedOptions[0]; if(o) o.textContent=(d.objet||'Sans objet')+(d.four?' · '+d.four:'')+' ('+d.lines.length+')'; save(); return; }
  if(t.id==='dfour'&&d){ d.four=t.value; save(); return; }
  if(t.dataset.lq&&d){ const l=d.lines.find(x=>x.id===t.dataset.lq); const v=parseFloat(String(t.value).replace(',','.')); if(l&&v>=0){ l.qty=v; refreshMail(); save(); } return; }
});
document.addEventListener('change',e=>{
  const t=e.target, d=act();
  if(t.id==='dsel'){ S.activeId=t.value; save(); renderDem(); return; }
  if(t.id==='cert'){ S.cert=t.checked; refreshMail(); save(); return; }
  if(t.dataset.lu&&d){ const l=d.lines.find(x=>x.id===t.dataset.lu); if(l){ l.unit=t.value; refreshMail(); save(); } return; }
  const s=t.dataset.sel; if(!s) return;
  if(s==='piece'){ const fm=fam(cur.fam); cur.piece=fm.pieces.findIndex(p=>p.n===t.value); cur.s1=null; cur.opts={}; cur.unit=null; renderBuild(); return; }
  if(s==='mat'){ cur.mat=t.value; return; }
  if(s==='unit'){ cur.unit=t.value; return; }
  if(s==='s1'){ cur.s1=+t.value; renderBuild(); return; }
  if(s.startsWith('o:')){ cur.opts[s.slice(2)]=t.value; return; }
});
function syncTabs(){ const v=$('app').dataset.view; document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===v?'true':'false')); }

/* ---------- Démarrage ---------- */
const saved=lsGet();
if(saved&&saved.demandes){ S=saved; if(!S.custom) S.custom=[]; if(S.cert==null) S.cert=false; } else S=exampleState();
if(!S.activeId&&S.demandes[0]) S.activeId=S.demandes[0].id;
renderAll(); syncTabs(); setSync('Enregistré sur cet appareil');
initStore();
})();
</script>
